# VoiceGuard Risk Engine Configuration
risk_engine:
  detectors:
    spoof:
      enabled: false
      reason: "Measured domain shift: ASVspoof bonafide stays bonafide after codec and level changes, but the project's live clips score 0.92 to 0.99 spoof; cause unknown"
    speaker:
      enabled: true
    replay:
      enabled: true

  weights:
    spoof: 0.00
    speaker: 0.50
    replay: 0.50

  bands:
    low_max: 0.30
    medium_max: 0.60

  speaker_mapping:
    # Linear map: risk_input = 1 - clip((sim - a) / (b - a), 0, 1)
    # Fit on all 40 phone_simulated evaluation clips (fit on all evaluation data, no held-out estimate)
    a: 0.3364065
    b: 0.4169240
    calibration_label: "fit on all evaluation data, no held-out estimate"

  context_adjustments:
    action_sensitivity:
      balance_check: 0.00
      wire_transfer: 0.20
      password_reset: 0.15
      unvalidated_design_label: "unvalidated design values"
    caller_not_allowlisted: 0.15
    call_time_anomaly: 0.10

  sustained_evidence:
    consecutive_windows_required: 3
    window_threshold_medium: 0.30
    window_threshold_high: 0.60
    rules:
      medium_sustained: "step_up"
      high_sustained: "block"
      reset_on_band_drop: true
